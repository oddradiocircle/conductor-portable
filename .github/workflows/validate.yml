name: Validate Conductor Portable

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package structure
        run: python3 tests/validate_package.py
      - name: Validate skills.sh discovery
        run: npx skills@latest add . --full-depth --list
